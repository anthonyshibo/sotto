<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>同传字幕</title>

<!-- 让"添加到主屏幕"后以独立 App 形式打开（iOS） -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="同传字幕" />
<meta name="theme-color" content="#0a0a0c" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #0a0a0c;
    --ink: #f4efe6;        /* 译文：暖白，主角 */
    --ink-dim: #7d786c;    /* 原文：低调灰 */
    --ghost: #3a3833;      /* 历史行：更淡 */
    --accent: #e0a05c;     /* 暖琥珀色，活动状态 */
    --accent-soft: rgba(224, 160, 92, 0.14);
    --line: rgba(244, 239, 230, 0.08);
    --sans: "Hanken Grotesk", -apple-system, sans-serif;
    --cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --display: "Fraunces", Georgia, serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(224,160,92,0.10), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px 12px;
    flex-shrink: 0;
  }
  .brand {
    font-family: var(--display);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.2px;
  }
  .brand .dot { color: var(--accent); }

  .lang {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .lang select {
    appearance: none;
    background: var(--accent-soft);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
  }

  /* ---------- 字幕舞台 ---------- */
  #stage {
    flex: 1;
    overflow-y: auto;
    padding: 8px 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 22px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #stage::-webkit-scrollbar { display: none; }

  .pair { animation: rise 0.35s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .pair .src {
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink-dim);
    margin-bottom: 6px;
    font-weight: 400;
  }
  .pair .dst {
    font-family: var(--cjk);
    font-size: 27px;
    line-height: 1.45;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: 0.2px;
  }

  /* 历史行：变小、变淡，营造"往上滚动"的纵深 */
  .pair.history .src { font-size: 13px; color: var(--ghost); }
  .pair.history .dst { font-size: 19px; color: var(--ink-dim); font-weight: 400; }

  /* 当前正在出的行，琥珀色游标 */
  .pair.live .dst::after {
    content: "";
    display: inline-block;
    width: 3px; height: 1.05em;
    background: var(--accent);
    margin-left: 3px;
    vertical-align: text-bottom;
    border-radius: 2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .placeholder {
    color: var(--ghost);
    font-size: 15px;
    text-align: center;
    line-height: 1.7;
    margin: auto 0;
  }
  .placeholder b { color: var(--ink-dim); font-weight: 500; }

  /* ---------- 底部控制 ---------- */
  footer {
    flex-shrink: 0;
    padding: 14px 22px calc(20px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    border-top: 1px solid var(--line);
    background: linear-gradient(to top, rgba(10,10,12,0.9), transparent);
  }

  .status {
    height: 18px;
    font-size: 13px;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.3s;
  }
  .status .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-dim);
  }
  .status.on { color: var(--accent); }
  .status.on .pulse { background: var(--accent); animation: ping 1.4s ease-in-out infinite; }
  @keyframes ping { 0%,100% { box-shadow: 0 0 0 0 rgba(224,160,92,0.5); } 50% { box-shadow: 0 0 0 7px rgba(224,160,92,0); } }

  .controls { display: flex; align-items: center; gap: 18px; }

  #toggle {
    width: 78px; height: 78px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #1a120a;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(224,160,92,0.35);
    transition: transform 0.15s, background 0.25s, box-shadow 0.25s;
  }
  #toggle:active { transform: scale(0.93); }
  #toggle.running {
    background: #2a2722;
    color: var(--accent);
    box-shadow: 0 0 0 1px var(--line);
  }
  #toggle svg { width: 30px; height: 30px; }

  .audio-toggle {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 999px;
    padding: 9px 14px;
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .audio-toggle.on { color: var(--accent); border-color: var(--accent); }

  .hint {
    font-size: 11px;
    color: var(--ghost);
    text-align: center;
    max-width: 320px;
    line-height: 1.5;
  }
</style>
</head>

<body>
  <header>
    <div class="brand">同传字幕<span class="dot">.</span></div>
    <label class="lang">
      译为
      <select id="target">
        <option value="zh" selected>中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
      </select>
    </label>
  </header>

  <div id="stage">
    <div class="placeholder" id="placeholder">
      点下方按钮开始<br />
      <b>用手机外放</b>播放外文视频，麦克风会听到声音并实时翻译
    </div>
  </div>

  <footer>
    <div class="status" id="status"><span class="pulse"></span><span id="statusText">待机</span></div>
    <div class="controls">
      <button class="audio-toggle" id="audioToggle">🔇 译文语音</button>
      <button id="toggle" aria-label="开始/停止">
        <!-- mic icon -->
        <svg id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>
      <!-- 占位让按钮居中对称 -->
      <span style="width:92px"></span>
    </div>
    <div class="hint" id="hint">约 $0.05 / 分钟 · 翻译时屏幕保持常亮，停止后恢复</div>
  </footer>

  <audio id="translatedAudio" autoplay></audio>

<script>
(() => {
  "use strict";

  const stage = document.getElementById("stage");
  const placeholder = document.getElementById("placeholder");
  const toggleBtn = document.getElementById("toggle");
  const icon = document.getElementById("icon");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const targetSel = document.getElementById("target");
  const audioToggle = document.getElementById("audioToggle");
  const translatedAudio = document.getElementById("translatedAudio");
  const hint = document.getElementById("hint");

  let pc = null;
  let localStream = null;
  let dataChannel = null;
  let wakeLock = null;
  let running = false;

  // 当前正在生成的一行（live）
  let liveEl = null, liveSrc = null, liveDst = null;
  let srcBuf = "", dstBuf = "";

  const MIC_ICON = `<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>`;
  const STOP_ICON = `<rect x="6" y="6" width="12" height="12" rx="2"/>`;

  function setStatus(text, on) {
    statusText.textContent = text;
    statusEl.classList.toggle("on", !!on);
  }

  // ---------- 字幕渲染 ----------
  function ensureLive() {
    if (liveEl) return;
    placeholder.style.display = "none";
    liveEl = document.createElement("div");
    liveEl.className = "pair live";
    liveSrc = document.createElement("div");
    liveSrc.className = "src";
    liveDst = document.createElement("div");
    liveDst.className = "dst";
    liveEl.appendChild(liveSrc);
    liveEl.appendChild(liveDst);
    stage.appendChild(liveEl);
  }

  function renderLive() {
    ensureLive();
    liveSrc.textContent = srcBuf;
    liveDst.textContent = dstBuf;
    stage.scrollTop = stage.scrollHeight;
  }

  // 一句翻译结束：把当前 live 行定格成历史行，清空缓冲
  function commitLine() {
    if (liveEl && (srcBuf || dstBuf)) {
      liveEl.classList.remove("live");
      liveEl.classList.add("history");
    } else if (liveEl) {
      liveEl.remove();
    }
    liveEl = liveSrc = liveDst = null;
    srcBuf = dstBuf = "";

    // 控制 DOM 数量，最多保留 40 行历史
    while (stage.querySelectorAll(".pair").length > 40) {
      stage.querySelector(".pair").remove();
    }
  }

  // ---------- 事件处理 ----------
  function onEvent(raw) {
    let evt;
    try { evt = JSON.parse(raw); } catch { return; }
    // 调试用：在浏览器控制台能看到所有事件类型
    console.log("[oai]", evt.type, evt);

    switch (evt.type) {
      case "session.input_transcript.delta":   // 原文
        srcBuf += evt.delta || "";
        setStatus("翻译中…", true);
        renderLive();
        break;
      case "session.output_transcript.delta":  // 译文
        dstBuf += evt.delta || "";
        setStatus("翻译中…", true);
        renderLive();
        break;
      case "session.output_transcript.done":
      case "session.output_transcript.completed":
        commitLine();
        setStatus("聆听中…", true);
        break;
      case "error":
        showError(evt.error?.message || "发生错误");
        break;
    }
  }

  function showError(msg) {
    placeholder.style.display = "";
    placeholder.innerHTML = "⚠️ " + msg;
  }

  // ---------- 屏幕常亮 ----------
  async function acquireWakeLock() {
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch (e) { /* 低电量等情况会失败，忽略即可 */ }
  }
  function releaseWakeLock() {
    try { wakeLock && wakeLock.release(); } catch {}
    wakeLock = null;
  }
  // 切回前台时，如果还在翻译就重新申请（锁会在页面隐藏时自动释放）
  document.addEventListener("visibilitychange", () => {
    if (running && document.visibilityState === "visible" && !wakeLock) {
      acquireWakeLock();
    }
  });

  // ---------- 启停 ----------
  async function start() {
    setStatus("连接中…", true);
    try {
      // 1. 找后端要短期密钥
      const r = await fetch("/session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ targetLanguage: targetSel.value }),
      });
      const data = await r.json();
      const clientSecret = data.value;
      if (!clientSecret) throw new Error(data.error || "拿不到密钥，检查后端和 API key");

      // 2. 打开麦克风（关闭浏览器的回声消除/降噪，尽量拿到原始外放声音）
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });

      // 3. 建立 WebRTC 连接
      pc = new RTCPeerConnection();
      pc.addTrack(localStream.getAudioTracks()[0], localStream);

      // 收到的是"翻译后的语音"，默认静音（我们只要字幕）
      pc.ontrack = (e) => { translatedAudio.srcObject = e.streams[0]; };
      translatedAudio.muted = !audioToggle.classList.contains("on");

      // 4. 数据通道：翻译文字从这里流回来
      dataChannel = pc.createDataChannel("oai-events");
      dataChannel.onmessage = (e) => onEvent(e.data);

      // 5. SDP 握手
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      const sdpResp = await fetch(
        "https://api.openai.com/v1/realtime/translations/calls",
        {
          method: "POST",
          headers: { Authorization: `Bearer ${clientSecret}`, "Content-Type": "application/sdp" },
          body: offer.sdp,
        }
      );
      if (!sdpResp.ok) throw new Error("连接失败：" + (await sdpResp.text()));
      await pc.setRemoteDescription({ type: "answer", sdp: await sdpResp.text() });

      // 6. 翻译开始 → 保持屏幕常亮
      await acquireWakeLock();

      running = true;
      icon.innerHTML = STOP_ICON;
      toggleBtn.classList.add("running");
      targetSel.disabled = true;
      setStatus("聆听中…", true);
    } catch (err) {
      console.error(err);
      showError(err.message || String(err));
      setStatus("待机", false);
      cleanup();
    }
  }

  function cleanup() {
    releaseWakeLock();                          // 停止 → 解除常亮，恢复省电
    try { dataChannel && dataChannel.close(); } catch {}
    try { pc && pc.close(); } catch {}
    if (localStream) localStream.getTracks().forEach((t) => t.stop());
    pc = dataChannel = localStream = null;
  }

  function stop() {
    running = false;
    cleanup();
    commitLine();
    icon.innerHTML = MIC_ICON;
    toggleBtn.classList.remove("running");
    targetSel.disabled = false;
    setStatus("待机", false);
  }

  toggleBtn.addEventListener("click", () => (running ? stop() : start()));

  audioToggle.addEventListener("click", () => {
    const on = audioToggle.classList.toggle("on");
    audioToggle.textContent = on ? "🔊 译文语音" : "🔇 译文语音";
    translatedAudio.muted = !on;
  });

  // 页面关闭/刷新时确保解除常亮
  window.addEventListener("pagehide", () => { if (running) cleanup(); });
})();
</script>
</body>
</html>
