<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Sotto</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sotto" />
<meta name="theme-color" content="#0a0a0c" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #0a0a0c;
    --ink: #f4efe6;
    --ink-dim: #7d786c;
    --ghost: #3a3833;
    --accent: #e0a05c;
    --accent-soft: rgba(224,160,92,0.14);
    --line: rgba(244,239,230,0.08);
    --sans: "Hanken Grotesk", -apple-system, sans-serif;
    --cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --display: "Fraunces", Georgia, serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }

  body {
    background: radial-gradient(120% 80% at 50% -10%, rgba(224,160,92,.10), transparent 55%), var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ── 顶栏 ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px 12px;
    flex-shrink: 0;
  }
  .brand { font-family:var(--display); font-weight:600; font-size:19px; }
  .brand .dot { color:var(--accent); }

  .header-right { display:flex; align-items:center; gap:10px; }

  .lang select, .settings-btn {
    appearance: none;
    background: var(--accent-soft);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
  }
  .settings-btn {
    cursor: pointer;
    padding: 5px 10px;
    font-size: 15px;
    line-height: 1;
    transition: background 0.2s;
  }
  .settings-btn:hover, .settings-btn.open { background: rgba(224,160,92,0.25); }

  /* ── 设置面板 ── */
  #settingsPanel {
    display: none;
    padding: 14px 22px 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
    gap: 12px;
    flex-direction: column;
  }
  .setting-row { display:flex; align-items:center; gap:14px; }
  .setting-label { font-size:12px; color:var(--ink-dim); width:60px; flex-shrink:0; }

  .pill-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 999px;
    padding: 5px 14px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .pill-btn.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .pill-btn:disabled { opacity:0.35; cursor:not-allowed; }

  .settings-input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    color: var(--ink);
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.2s;
  }
  .settings-input:focus { border-color: rgba(224,160,92,0.5); }
  .settings-input::placeholder { color:var(--ghost); }

  /* ── 字幕舞台 ── */
  #stage {
    flex: 1;
    overflow-y: auto;
    padding: 8px 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 22px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #stage::-webkit-scrollbar { display:none; }

  .pair { animation: rise 0.35s ease; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  .pair .src { font-size:15px; line-height:1.5; color:var(--ink-dim); margin-bottom:6px; }
  .pair .dst { font-family:var(--cjk); font-size:27px; line-height:1.45; color:var(--ink); font-weight:500; letter-spacing:0.2px; }

  .pair.history .src { font-size:13px; color:var(--ghost); }
  .pair.history .dst { font-size:19px; color:var(--ink-dim); font-weight:400; }

  .pair.live .dst::after {
    content:""; display:inline-block; width:3px; height:1.05em;
    background:var(--accent); margin-left:3px; vertical-align:text-bottom;
    border-radius:2px; animation:blink 1s step-end infinite;
  }
  @keyframes blink { 50%{opacity:0;} }

  .placeholder { color:var(--ghost); font-size:15px; text-align:center; line-height:1.7; margin:auto 0; }
  .placeholder b { color:var(--ink-dim); font-weight:500; }

  /* ── 底部控制 ── */
  footer {
    flex-shrink: 0;
    padding: 14px 22px calc(20px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    border-top: 1px solid var(--line);
    background: linear-gradient(to top, rgba(10,10,12,.9), transparent);
  }

  .status { height:18px; font-size:13px; color:var(--ink-dim); display:flex; align-items:center; gap:8px; transition:color .3s; }
  .status .pulse { width:8px; height:8px; border-radius:50%; background:var(--ink-dim); }
  .status.on { color:var(--accent); }
  .status.on .pulse { background:var(--accent); animation:ping 1.4s ease-in-out infinite; }
  @keyframes ping { 0%,100%{box-shadow:0 0 0 0 rgba(224,160,92,.5);} 50%{box-shadow:0 0 0 7px rgba(224,160,92,0);} }

  .controls { display:flex; align-items:center; gap:18px; }

  #toggle {
    width:78px; height:78px; border-radius:50%; border:none;
    background:var(--accent); color:#1a120a;
    display:grid; place-items:center; cursor:pointer;
    box-shadow:0 8px 30px rgba(224,160,92,.35);
    transition:transform .15s, background .25s, box-shadow .25s;
  }
  #toggle:active { transform:scale(.93); }
  #toggle.running { background:#2a2722; color:var(--accent); box-shadow:0 0 0 1px var(--line); }
  #toggle svg { width:30px; height:30px; }

  .hint { font-size:11px; color:var(--ghost); text-align:center; max-width:320px; line-height:1.5; }

  /* Provider 标签 */
  .provider-badge {
    font-size:10px; color:var(--ink-dim); background:var(--accent-soft);
    border:1px solid var(--line); border-radius:999px; padding:2px 8px;
    font-weight:500; letter-spacing:0.3px;
  }
</style>
</head>

<body>
  <header>
    <div class="brand">Sotto<span class="dot">.</span></div>
    <div class="header-right">
      <label class="lang" style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-dim);">
        译为
        <select id="target">
          <option value="zh" selected>中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
        </select>
      </label>
      <button class="settings-btn" id="settingsBtn" aria-label="设置">⚙</button>
    </div>
  </header>

  <!-- 设置面板 -->
  <div id="settingsPanel">
    <div class="setting-row">
      <span class="setting-label">Provider</span>
      <div style="display:flex;gap:6px;">
        <button class="pill-btn" id="provBtn-aliyun">阿里云</button>
        <button class="pill-btn" id="provBtn-openai" disabled title="Phase B 即将支持">OpenAI</button>
      </div>
    </div>
    <div class="setting-row" id="serverRow">
      <span class="setting-label">Server URL</span>
      <input id="serverUrlInput" class="settings-input" type="text"
        placeholder="wss://your-server.com" />
    </div>
    <div class="setting-row">
      <span class="setting-label">源语言</span>
      <select id="source" class="settings-input" style="flex:none;width:auto;padding:7px 12px;">
        <option value="en" selected>英语</option>
        <option value="zh">中文</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="ru">俄语</option>
      </select>
    </div>
  </div>

  <div id="stage">
    <div class="placeholder" id="placeholder">
      点下方按钮开始<br />
      <b>用手机外放</b>播放外文视频，麦克风会听到声音并实时翻译
    </div>
  </div>

  <footer>
    <div class="status" id="status"><span class="pulse"></span><span id="statusText">待机</span></div>
    <div class="controls">
      <span id="providerBadge" class="provider-badge">阿里云</span>
      <button id="toggle" aria-label="开始/停止">
        <svg id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>
      <span style="width:72px"></span>
    </div>
    <div class="hint">约 $0.02–0.05 / 分钟 · 翻译时屏幕保持常亮</div>
  </footer>

<script>
(() => {
'use strict';

// ══════════════════════════════════════════════════════════════════════════════
// Provider 接口约定（注释即文档）
// ──────────────────────────────────────────────────────────────────────────────
// 每个 Provider 需要：
//   属性（由外部赋值）：
//     onSrcUpdate(text)   原文更新（替换整行，非追加）
//     onDstUpdate(text)   译文更新（替换整行，非追加）
//     onCommit()          提交当前句子到历史，清空 live 行
//     onStatus(s)         状态：'idle'|'connecting'|'listening'|'translating'
//     onError(msg)        发生错误
//   方法：
//     async start()       开始采音 + 建连（会 throw 如果失败）
//     stop()              停止一切
// ══════════════════════════════════════════════════════════════════════════════

// ── Phase A: 阿里云 DashScope Provider ────────────────────────────────────────
class AliyunProvider {
  constructor({ serverUrl, targetLang = 'zh', sourceLang = 'en' }) {
    this.serverUrl  = serverUrl;
    this.targetLang = targetLang;
    this.sourceLang = sourceLang;
    this.ws         = null;
    this.audioCtx   = null;
    this.stream     = null;
    this.processor  = null;

    this.onSrcUpdate = () => {};
    this.onDstUpdate = () => {};
    this.onCommit    = () => {};
    this.onStatus    = () => {};
    this.onError     = () => {};
  }

  async start() {
    if (!this.serverUrl) throw new Error('请在设置中填写 Server URL');

    // 1. 打开麦克风 —— 关掉所有 DSP，获取最原始的声音
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });

    // 2. 以 16kHz 建立 AudioContext（DashScope 要求 16kHz PCM16）
    this.audioCtx = new AudioContext({ sampleRate: 16000 });
    if (Math.abs(this.audioCtx.sampleRate - 16000) > 200) {
      console.warn(`AudioContext 采样率为 ${this.audioCtx.sampleRate}Hz（非 16kHz），识别质量可能受影响`);
    }

    const source = this.audioCtx.createMediaStreamSource(this.stream);

    // ScriptProcessor：每 1600 帧（100ms@16kHz）触发一次
    // 注意：ScriptProcessor 已被标记废弃，Phase B 迁移至 AudioWorklet
    this.processor = this.audioCtx.createScriptProcessor(1600, 1, 1);
    this.processor.onaudioprocess = (e) => {
      const float32 = e.inputBuffer.getChannelData(0);
      const pcm16   = this._float32ToInt16(float32);
      if (this.ws?.readyState === WebSocket.OPEN)
        this.ws.send(pcm16.buffer);
    };
    source.connect(this.processor);
    this.processor.connect(this.audioCtx.destination);  // 必须接 destination 才会触发

    // 3. 连接到代理服务器
    return new Promise((resolve, reject) => {
      const wsUrl = this.serverUrl.replace(/\/$/, '');
      let settled = false;
      const settle = (fn, val) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        fn(val);
      };
      const timer = setTimeout(
        () => settle(reject, new Error('服务器连接超时（15s），请检查 Server URL 和网络')),
        15000
      );

      this.ws = new WebSocket(wsUrl);
      this.ws.binaryType = 'arraybuffer';

      this.ws.onopen = () => {
        this.ws.send(JSON.stringify({
          type:       'config',
          targetLang: this.targetLang,
          sourceLang: this.sourceLang,
        }));
        this.onStatus('connecting');
      };

      this.ws.onmessage = ({ data }) => {
        let msg;
        try { msg = JSON.parse(data); } catch { return; }

        switch (msg.type) {
          case 'ready':
            // 服务器已和 DashScope 握手完成，可以开口说话了
            settle(resolve);
            this.onStatus('listening');
            break;

          case 'src.update':
            // 原文 interim（stash）：随着识别推进，文字会逐步稳定
            if (msg.text) {
              this.onSrcUpdate(msg.text);
              this.onStatus('translating');
            }
            break;

          case 'src.done':
            // 原文 final：本句识别结束，用最终版本替换
            if (msg.text) this.onSrcUpdate(msg.text);
            break;

          case 'dst.done':
            // 译文完成：显示 800ms 后 commit，给用户时间读一眼完整的对
            if (msg.text) {
              this.onDstUpdate(msg.text);
              setTimeout(() => {
                this.onCommit();
                this.onStatus('listening');
              }, 800);
            }
            break;

          case 'turn.done':
            this.onStatus('listening');
            break;

          case 'error':
            settle(reject, new Error(msg.message || '服务器错误'));
            this.onError(msg.message || '服务器错误');
            break;
        }
      };

      this.ws.onerror = () => settle(reject, new Error('WebSocket 连接失败，请检查 Server URL'));
      this.ws.onclose = () => { if (this.onStatus) this.onStatus('idle'); };
    });
  }

  stop() {
    this.processor?.disconnect();
    this.audioCtx?.close().catch(() => {});
    this.stream?.getTracks().forEach(t => t.stop());
    this.ws?.close();
    this.ws = this.processor = this.audioCtx = this.stream = null;
  }

  _float32ToInt16(float32) {
    const int16 = new Int16Array(float32.length);
    for (let i = 0; i < float32.length; i++) {
      const s   = Math.max(-1, Math.min(1, float32[i]));
      int16[i]  = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return int16;
  }
}

// ── Phase B: OpenAI WebRTC Provider（占位，Phase B 实现）─────────────────────
class OpenAIProvider {
  constructor(_config) {
    this.onSrcUpdate = () => {};
    this.onDstUpdate = () => {};
    this.onCommit    = () => {};
    this.onStatus    = () => {};
    this.onError     = () => {};
  }
  async start() {
    throw new Error('OpenAI Provider 将在 Phase B 实现，敬请期待');
  }
  stop() {}
}

// ── Provider 工厂 ──────────────────────────────────────────────────────────────
function createProvider(type, config) {
  if (type === 'aliyun') return new AliyunProvider(config);
  if (type === 'openai') return new OpenAIProvider(config);
  throw new Error('未知 Provider: ' + type);
}

// ══════════════════════════════════════════════════════════════════════════════
// UI 状态
// ══════════════════════════════════════════════════════════════════════════════
const stage       = document.getElementById('stage');
const placeholder = document.getElementById('placeholder');
const toggleBtn   = document.getElementById('toggle');
const icon        = document.getElementById('icon');
const statusEl    = document.getElementById('status');
const statusText  = document.getElementById('statusText');
const targetSel   = document.getElementById('target');
const sourceSel   = document.getElementById('source');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const serverInput = document.getElementById('serverUrlInput');
const badge       = document.getElementById('providerBadge');

let running    = false;
let provider   = null;
let wakeLock   = null;

// 持久化设置
let providerType = localStorage.getItem('sotto_provider')    || 'aliyun';
let serverUrl    = localStorage.getItem('sotto_server_url')  || '';
let targetLang   = localStorage.getItem('sotto_target_lang') || 'zh';
let sourceLang   = localStorage.getItem('sotto_source_lang') || 'en';

// ── 字幕 DOM ──────────────────────────────────────────────────────────────────
let liveEl = null, liveSrc = null, liveDst = null;

const MIC_ICON  = `<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>`;
const STOP_ICON = `<rect x="6" y="6" width="12" height="12" rx="2"/>`;

function ensureLive() {
  if (liveEl) return;
  placeholder.style.display = 'none';
  liveEl  = document.createElement('div');
  liveSrc = document.createElement('div');
  liveDst = document.createElement('div');
  liveEl.className  = 'pair live';
  liveSrc.className = 'src';
  liveDst.className = 'dst';
  liveEl.appendChild(liveSrc);
  liveEl.appendChild(liveDst);
  stage.appendChild(liveEl);
}

function commitLine() {
  if (liveEl) {
    if (liveSrc?.textContent || liveDst?.textContent) {
      liveEl.classList.remove('live');
      liveEl.classList.add('history');
    } else {
      liveEl.remove();
    }
  }
  liveEl = liveSrc = liveDst = null;
  // 只保留最近 40 条历史
  while (stage.querySelectorAll('.pair').length > 40)
    stage.querySelector('.pair').remove();
}

function setStatus(text, on) {
  statusText.textContent = text;
  statusEl.classList.toggle('on', !!on);
}

function showError(msg) {
  placeholder.style.display = '';
  placeholder.innerHTML = `⚠️ ${msg}`;
}

// ── 屏幕常亮 ──────────────────────────────────────────────────────────────────
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch {}
}
function releaseWakeLock() {
  wakeLock?.release().catch(() => {});
  wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if (running && document.visibilityState === 'visible' && !wakeLock)
    acquireWakeLock();
});

// ── 开始 / 停止 ───────────────────────────────────────────────────────────────
async function start() {
  const config = {
    serverUrl,
    targetLang: targetSel.value,
    sourceLang: sourceSel.value,
  };

  provider = createProvider(providerType, config);

  // 绑定 Provider 回调 → 字幕 UI
  provider.onSrcUpdate = (text) => {
    ensureLive();
    liveSrc.textContent = text;
    stage.scrollTop = stage.scrollHeight;
  };
  provider.onDstUpdate = (text) => {
    ensureLive();
    liveDst.textContent = text;
    stage.scrollTop = stage.scrollHeight;
  };
  provider.onCommit = commitLine;
  provider.onStatus = (s) => {
    const map = { idle:'待机', connecting:'连接中…', listening:'聆听中…', translating:'翻译中…' };
    setStatus(map[s] || s, s !== 'idle');
  };
  provider.onError = (m) => {
    showError(m);
    if (running) stop();
  };

  try {
    setStatus('连接中…', true);
    await provider.start();
    await acquireWakeLock();

    running = true;
    icon.innerHTML = STOP_ICON;
    toggleBtn.classList.add('running');
    targetSel.disabled = true;
    sourceSel.disabled = true;
    settingsBtn.disabled = true;
  } catch (err) {
    console.error(err);
    showError(err.message || String(err));
    setStatus('待机', false);
    provider?.stop();
    provider = null;
  }
}

function stop() {
  running = false;
  provider?.stop();
  provider = null;
  releaseWakeLock();
  commitLine();
  icon.innerHTML = MIC_ICON;
  toggleBtn.classList.remove('running');
  targetSel.disabled = false;
  sourceSel.disabled = false;
  settingsBtn.disabled = false;
  setStatus('待机', false);
}

toggleBtn.addEventListener('click', () => running ? stop() : start());

// ── 设置面板 ──────────────────────────────────────────────────────────────────
function setProvider(type) {
  providerType = type;
  localStorage.setItem('sotto_provider', type);
  document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('provBtn-' + type)?.classList.add('active');
  document.getElementById('serverRow').style.display = type === 'aliyun' ? 'flex' : 'none';
  badge.textContent = type === 'aliyun' ? '阿里云' : 'OpenAI';
}

settingsBtn.addEventListener('click', () => {
  const open = settingsPanel.style.display !== 'flex';
  settingsPanel.style.display = open ? 'flex' : 'none';
  settingsBtn.classList.toggle('open', open);
});

document.getElementById('provBtn-aliyun').addEventListener('click', () => setProvider('aliyun'));
document.getElementById('provBtn-openai').addEventListener('click', () => setProvider('openai'));

serverInput.addEventListener('input', (e) => {
  serverUrl = e.target.value.trim();
  localStorage.setItem('sotto_server_url', serverUrl);
});

targetSel.addEventListener('change', (e) => {
  targetLang = e.target.value;
  localStorage.setItem('sotto_target_lang', targetLang);
});

sourceSel.addEventListener('change', (e) => {
  sourceLang = e.target.value;
  localStorage.setItem('sotto_source_lang', sourceLang);
});

// ── 初始化 ────────────────────────────────────────────────────────────────────
serverInput.value = serverUrl;
targetSel.value   = targetLang;
sourceSel.value   = sourceLang;
setProvider(providerType);

window.addEventListener('pagehide', () => { if (running) { provider?.stop(); releaseWakeLock(); } });

})();
</script>
</body>
